name: Bug report
description: Something does not build, crashes, or gives a wrong result.
labels: ["type: bug", "status: needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command that reproduces it
      description: The smallest command or input that shows the problem, starting from a fresh clone if you can.
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or release
      placeholder: "e.g. v1.4.1 or 3f2a9c1"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Toolchain and machine
      placeholder: "e.g. Zig 0.16.0, macOS 26 on Apple M2"
    validations:
      required: true
