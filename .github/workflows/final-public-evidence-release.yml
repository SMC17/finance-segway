name: Final Public Evidence Release

on:
  pull_request:
    paths:
      - "tools/final_public_evidence_registry.py"
      - "tools/final_public_evidence.py"
      - "tools/final_public_evidence_release.py"
      - "tests/test_final_public_evidence.py"
      - ".github/workflows/final-public-evidence-release.yml"
      - "tools/m3_evidence.py"
      - "tools/model_instance_release.py"
      - "tools/evidence_receipt_integrity.py"
      - "standards/benchmark_cases/**"
  push:
    branches:
      - agent/all-domain-m3-evidence-network-risk
    paths:
      - "tools/final_public_evidence_registry.py"
      - "tools/final_public_evidence.py"
      - "tools/final_public_evidence_release.py"
      - "tests/test_final_public_evidence.py"
      - ".github/workflows/final-public-evidence-release.yml"
      - "tools/m3_evidence.py"
      - "tools/model_instance_release.py"
      - "tools/evidence_receipt_integrity.py"
      - "standards/benchmark_cases/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-public-evidence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable frontier head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture immutable source head
        run: git rev-parse HEAD > .final-evidence-start-sha

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile and test final evidence source
        run: |
          python -m compileall -q tools tests
          PYTHONPATH=. python -m unittest tests.test_final_public_evidence -v
          PYTHONPATH=. python -m unittest tests.test_m3_evidence -v
          PYTHONPATH=. python -m unittest tests.test_committed_frontier_release -v

      - name: Materialize final six evidence packs and twelve public instances
        run: |
          PYTHONPATH=.:tools python tools/final_public_evidence_release.py \
            --generate-instances --require-instances

      - name: Enforce pre-recalculation contracts, surfaces, and engineering audit
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import json
          from pathlib import Path

          from tools.final_public_evidence_registry import registry
          from tools.institutional_surface import profiles_by_id, validate_workbook_surface
          from tools.validate_legacy_release_workbooks import validate_workbook
          from tools.workbook_engineering import audit_workbook

          root = Path('.')
          inventory = json.loads(Path('standards/model_inventory.json').read_text(encoding='utf-8'))
          inventory_by_id = {item['id']: item for item in inventory['models']}
          profiles = profiles_by_id(root)
          errors = []
          contracts = []
          surfaces = []
          audits = []
          count = 0
          for model in registry()['flagships']:
              model_id = model['model_id']
              for case in model['cases']:
                  count += 1
                  path = Path(case['output'])
                  result = validate_workbook(model_id, path)
                  contracts.append({'case_id': case['id'], **result})
                  errors.extend(f"{case['id']}: {item}" for item in result['errors'])
                  surface_errors = validate_workbook_surface(
                      path, inventory_by_id[model_id], profiles[model_id]
                  )
                  surfaces.append(
                      {'case_id': case['id'], 'path': str(path), 'errors': surface_errors}
                  )
                  errors.extend(f"{case['id']}: surface {item}" for item in surface_errors)
                  summary, findings = audit_workbook(path)
                  audit_errors = [
                      finding.__dict__
                      for finding in findings
                      if finding.severity == 'error'
                  ]
                  audits.append(
                      {
                          'case_id': case['id'],
                          'path': str(path),
                          'summary': summary,
                          'errors': audit_errors,
                      }
                  )
                  errors.extend(
                      f"{case['id']}: engineering {item}" for item in audit_errors
                  )
          if count != 12:
              errors.append(f'expected 12 final public workbooks, found {count}')
          report = {
              'status': 'PASS' if not errors else 'FAIL',
              'workbooks': count,
              'contracts': contracts,
              'surfaces': surfaces,
              'audits': audits,
              'errors': errors,
          }
          Path('final-public-pre-recalc-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          if errors:
              raise SystemExit(errors)
          PY

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Independently recalculate twelve final public workbooks
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import json
          from pathlib import Path

          from recalc import recalc
          from tools.final_public_evidence import case_outputs

          paths = case_outputs()
          if len(paths) != 12 or len(set(paths)) != 12:
              raise SystemExit(f'expected 12 unique final evidence workbooks, found {len(paths)}')
          report = {}
          failed = []
          for path in paths:
              result = recalc(path, timeout=120)
              report[str(path)] = result
              if result.get('status') != 'success' or result.get('total_errors', 0) != 0:
                  failed.append(str(path))
          Path('final-public-recalc-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          if failed:
              raise SystemExit(f'final public workbook recalculation failed: {failed}')
          PY

      - name: Refresh and verify all forty-eight public evidence receipts
        run: |
          PYTHONPATH=. python tools/evidence_receipt_integrity.py \
            --refresh --check --report final-public-receipt-integrity-report.json

      - name: Enforce post-recalculation contracts, surfaces, and engineering audit
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import json
          from pathlib import Path

          from tools.final_public_evidence_registry import registry
          from tools.institutional_surface import profiles_by_id, validate_workbook_surface
          from tools.validate_legacy_release_workbooks import validate_workbook
          from tools.workbook_engineering import audit_workbook

          root = Path('.')
          inventory = json.loads(Path('standards/model_inventory.json').read_text(encoding='utf-8'))
          inventory_by_id = {item['id']: item for item in inventory['models']}
          profiles = profiles_by_id(root)
          errors = []
          contracts = []
          surfaces = []
          audits = []
          for model in registry()['flagships']:
              model_id = model['model_id']
              for case in model['cases']:
                  path = Path(case['output'])
                  result = validate_workbook(model_id, path)
                  contracts.append({'case_id': case['id'], **result})
                  errors.extend(f"{case['id']}: {item}" for item in result['errors'])
                  surface_errors = validate_workbook_surface(
                      path, inventory_by_id[model_id], profiles[model_id]
                  )
                  surfaces.append(
                      {'case_id': case['id'], 'path': str(path), 'errors': surface_errors}
                  )
                  errors.extend(f"{case['id']}: surface {item}" for item in surface_errors)
                  summary, findings = audit_workbook(path)
                  audit_errors = [
                      finding.__dict__
                      for finding in findings
                      if finding.severity == 'error'
                  ]
                  audits.append(
                      {
                          'case_id': case['id'],
                          'path': str(path),
                          'summary': summary,
                          'errors': audit_errors,
                      }
                  )
                  errors.extend(
                      f"{case['id']}: engineering {item}" for item in audit_errors
                  )
          report = {
              'status': 'PASS' if not errors else 'FAIL',
              'contracts': contracts,
              'surfaces': surfaces,
              'audits': audits,
              'errors': errors,
          }
          Path('final-public-post-recalc-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          if errors:
              raise SystemExit(errors)
          PY

      - name: Validate all-domain evidence, frontier controls, and committed release
        run: |
          PYTHONPATH=.:tools python tools/final_public_evidence.py \
            --validate --require-instances
          PYTHONPATH=. python tools/validate_frontier_program.py \
            --report final-public-frontier-report.json
          PYTHONPATH=.:tools python tools/validate_committed_frontier_release.py \
            --report final-public-committed-release-report.json
          PYTHONPATH=.:tools python tools/validate_model_inventory.py \
            --report final-public-inventory-report.json
          PYTHONPATH=.:tools python tools/build_all_models.py \
            --report final-public-builder-parity-report.json \
            --require-parity

      - name: Reject stale final evidence release
        if: github.event_name == 'push'
        run: |
          git fetch origin agent/all-domain-m3-evidence-network-risk
          START_SHA=$(cat .final-evidence-start-sha)
          REMOTE_SHA=$(git rev-parse origin/agent/all-domain-m3-evidence-network-risk)
          echo "final evidence source: $START_SHA"
          echo "remote source:         $REMOTE_SHA"
          test "$START_SHA" = "$REMOTE_SHA"

      - name: Commit atomic all-domain public evidence release
        if: github.event_name == 'push'
        run: |
          git config user.name "finance-segway-all-domain-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            standards/m3_evidence/final_six_registry.json \
            standards/public_cases \
            01_Investment_Banking/model_card.md 01_Investment_Banking/validation.md 01_Investment_Banking/sources 01_Investment_Banking/governance 01_Investment_Banking/outcomes 01_Investment_Banking/releases 01_Investment_Banking/instances/public_* \
            02_Corporate_Finance/model_card.md 02_Corporate_Finance/validation.md 02_Corporate_Finance/sources 02_Corporate_Finance/governance 02_Corporate_Finance/outcomes 02_Corporate_Finance/releases 02_Corporate_Finance/instances/public_* \
            05_Private_Credit/model_card.md 05_Private_Credit/validation.md 05_Private_Credit/sources 05_Private_Credit/governance 05_Private_Credit/outcomes 05_Private_Credit/releases 05_Private_Credit/instances/public_* \
            06_Debt_Finance/model_card.md 06_Debt_Finance/validation.md 06_Debt_Finance/sources 06_Debt_Finance/governance 06_Debt_Finance/outcomes 06_Debt_Finance/releases 06_Debt_Finance/instances/public_* \
            07_Public_Finance/model_card.md 07_Public_Finance/validation.md 07_Public_Finance/sources 07_Public_Finance/governance 07_Public_Finance/outcomes 07_Public_Finance/releases 07_Public_Finance/instances/public_* \
            13_Venture_Capital/model_card.md 13_Venture_Capital/validation.md 13_Venture_Capital/sources 13_Venture_Capital/governance 13_Venture_Capital/outcomes 13_Venture_Capital/releases 13_Venture_Capital/instances/public_* \
            */instances/public_*.receipt.json \
            final-public-evidence-report.json all-domain-public-evidence-report.json
          if git diff --staged --quiet; then
            echo "All-domain public evidence release is already current."
          else
            git commit -m "Complete public historical evidence for all 24 domains"
            git push origin HEAD:agent/all-domain-m3-evidence-network-risk
          fi

      - name: Upload final public evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-public-evidence-${{ github.event_name }}
          path: |
            final-public-pre-recalc-report.json
            final-public-recalc-report.json
            final-public-receipt-integrity-report.json
            final-public-post-recalc-report.json
            final-public-evidence-report.json
            all-domain-public-evidence-report.json
            final-public-frontier-report.json
            final-public-committed-release-report.json
            final-public-inventory-report.json
            final-public-builder-parity-report.json
            standards/public_cases/index.json
          if-no-files-found: warn
          retention-days: 30
