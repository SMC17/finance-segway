name: Promote Flagship Artifacts

on:
  push:
    branches: [agent/synthesize-finance-model-library-v2]
    paths:
      - 'tools/builders/build_options_institutional.py'
      - 'tools/builders/build_project_finance_institutional.py'
      - 'tools/builders/build_securitization_institutional.py'
      - 'tools/builders/build_insurance_institutional.py'
      - 'tools/builders/build_quant_institutional.py'
      - 'tools/builders/build_risk_institutional.py'
      - 'tools/validate_options_model.py'
      - 'tools/validate_project_finance_model.py'
      - 'tools/validate_securitization_model.py'
      - 'tools/validate_insurance_model.py'
      - 'tools/validate_quant_model.py'
      - 'tools/validate_risk_model.py'
      - 'finance_segway/**'
      - 'tests/test_institutional_engines.py'
      - '.github/workflows/promote-flagship-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-flagship-artifacts
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synthesis branch
        uses: actions/checkout@v4
        with:
          ref: agent/synthesize-finance-model-library-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile and test institutional engines
        run: |
          python -m compileall -q finance_segway tools tests
          PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Generate flagship workbooks
        run: |
          PYTHONPATH=.:tools python tools/builders/build_options_institutional.py --output 14_Options_Derivatives/_template_OPTIONS.xlsx
          PYTHONPATH=.:tools python tools/builders/build_project_finance_institutional.py --output 20_Project_Finance/_template_PROJECT_FINANCE.xlsx
          PYTHONPATH=.:tools python tools/builders/build_securitization_institutional.py --output 19_Structured_Finance_Securitization/_template_SECURITIZATION.xlsx
          PYTHONPATH=.:tools python tools/builders/build_insurance_institutional.py --output 18_Insurance_Actuarial/_template_INSURANCE.xlsx
          PYTHONPATH=.:tools python tools/builders/build_quant_institutional.py --output 22_Quantitative_Systematic/_template_QUANT.xlsx
          PYTHONPATH=.:tools python tools/builders/build_risk_institutional.py --output 09_Risk_Management/_template_RISK.xlsx
          python - <<'PY'
          from openpyxl import load_workbook
          path = '18_Insurance_Actuarial/_template_INSURANCE.xlsx'
          workbook = load_workbook(path)
          workbook['Chain Ladder']['L6'] = 1
          workbook['Chain Ladder']['L6'].number_format = '0.0000x'
          workbook.save(path)
          PY

      - name: Enforce flagship workbook contracts
        run: |
          PYTHONPATH=.:tools python tools/validate_options_model.py 14_Options_Derivatives/_template_OPTIONS.xlsx
          PYTHONPATH=.:tools python tools/validate_project_finance_model.py 20_Project_Finance/_template_PROJECT_FINANCE.xlsx
          PYTHONPATH=.:tools python tools/validate_securitization_model.py 19_Structured_Finance_Securitization/_template_SECURITIZATION.xlsx
          PYTHONPATH=.:tools python tools/validate_insurance_model.py 18_Insurance_Actuarial/_template_INSURANCE.xlsx
          PYTHONPATH=.:tools python tools/validate_quant_model.py 22_Quantitative_Systematic/_template_QUANT.xlsx
          PYTHONPATH=.:tools python tools/validate_risk_model.py 09_Risk_Management/_template_RISK.xlsx

      - name: Promote inventory contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('standards/model_inventory.json')
          inventory = json.loads(path.read_text())
          inventory['version'] = '2.0.0'
          by_id = {item['id']: item for item in inventory['models']}

          updates = {
              '09': {
                  'builder': 'tools/builders/build_risk_institutional.py',
                  'required_engines': ['position_inventory', 'factor_covariance', 'var', 'expected_shortfall', 'stress_testing', 'liquidity_risk', 'pnl_explain', 'limit_monitoring'],
                  'required_perspectives': ['trader', 'risk', 'management', 'regulator'],
                  'reference_checks': ['covariance_bounds', 'variance_nonnegative', 'expected_shortfall_var_order', 'limit_headroom'],
              },
              '14': {
                  'builder': 'tools/builders/build_options_institutional.py',
                  'required_engines': ['black_scholes', 'implied_volatility', 'american_option', 'volatility_surface', 'portfolio_greeks', 'scenario_pnl', 'strategy_payoff'],
                  'required_perspectives': ['trader', 'market_maker', 'risk', 'portfolio_manager'],
                  'reference_checks': ['put_call_parity', 'implied_volatility_convergence', 'option_price_bounds', 'greek_signs', 'american_european_bound'],
              },
              '18': {
                  'builder': 'tools/builders/build_insurance_institutional.py',
                  'required_engines': ['paid_triangle', 'chain_ladder', 'bornhuetter_ferguson', 'underwriting', 'embedded_value', 'capital_requirement', 'stress_testing'],
                  'required_perspectives': ['actuary', 'underwriter', 'management', 'regulator', 'rating_agency'],
                  'reference_checks': ['triangle_monotonicity', 'development_factor_bounds', 'reserve_nonnegative', 'capital_coverage'],
              },
              '19': {
                  'builder': 'tools/builders/build_securitization_institutional.py',
                  'required_engines': ['collateral_rollforward', 'cpr_cdr', 'recovery_lag', 'interest_waterfall', 'principal_waterfall', 'oc_ic_triggers', 'wal', 'sensitivity'],
                  'required_perspectives': ['issuer', 'investor', 'servicer', 'trustee', 'rating_agency'],
                  'reference_checks': ['collateral_conservation', 'waterfall_conservation', 'tranche_balance_nonnegative', 'wal_bounds'],
              },
              '20': {
                  'builder': 'tools/builders/build_project_finance_institutional.py',
                  'required_engines': ['construction_draw', 'interest_during_construction', 'sources_uses', 'operating_cfads', 'debt_sculpting', 'dsra', 'dscr', 'llcr', 'plcr', 'sensitivity'],
                  'required_perspectives': ['sponsor', 'lender', 'independent_engineer', 'offtaker', 'dfi'],
                  'reference_checks': ['sources_uses_balance', 'construction_draw_conservation', 'debt_schedule_conservation', 'dscr_identity', 'llcr_identity'],
              },
              '22': {
                  'builder': 'tools/builders/build_quant_institutional.py',
                  'required_engines': ['point_in_time_backtest', 'walk_forward', 'transaction_costs', 'capacity', 'performance', 'var_es', 'stress_testing', 'backtest_live_controls'],
                  'required_perspectives': ['researcher', 'portfolio_manager', 'risk', 'execution'],
                  'reference_checks': ['gross_net_order', 'max_drawdown_identity', 'var_es_order', 'walk_forward_partition', 'cost_monotonicity'],
              },
          }
          for model_id, update in updates.items():
              model = by_id[model_id]
              model['builder'] = update['builder']
              model['declared_maturity'] = 'M2'
              model['required_engines'] = update['required_engines']
              model['required_perspectives'] = update['required_perspectives']
              model['reference_checks'] = update['reference_checks']

          path.write_text(json.dumps(inventory, indent=2) + '\n')
          PY

      - name: Validate full inventory and workbook library
        run: |
          PYTHONPATH=.:tools python tools/validate_model_inventory.py --report model-governance-report.json
          PYTHONPATH=.:tools python tools/workbook_engineering.py . --report workbook-engineering-report.json

      - name: Commit canonical artifacts and inventory
        run: |
          git config user.name 'finance-segway-model-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            09_Risk_Management/_template_RISK.xlsx \
            14_Options_Derivatives/_template_OPTIONS.xlsx \
            18_Insurance_Actuarial/_template_INSURANCE.xlsx \
            19_Structured_Finance_Securitization/_template_SECURITIZATION.xlsx \
            20_Project_Finance/_template_PROJECT_FINANCE.xlsx \
            22_Quantitative_Systematic/_template_QUANT.xlsx \
            standards/model_inventory.json
          if git diff --staged --quiet; then
            echo 'Flagship artifacts already match canonical builders.'
          else
            git commit -m 'Promote six engineered flagship models'
            git pull --rebase origin agent/synthesize-finance-model-library-v2
            git push origin HEAD:agent/synthesize-finance-model-library-v2
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-promotion-reports
          path: |
            model-governance-report.json
            workbook-engineering-report.json
          if-no-files-found: warn
          retention-days: 30
