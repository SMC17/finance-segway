name: Promote Flagship Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Promotion gate
        run: |
          echo "Automatic artifact promotion is paused."
          echo "Release artifacts must be proposed in a reviewed pull request."

