name: Legacy Engine Promotion Release

on:
  pull_request:
    paths:
      - "tools/release_legacy_engine_promotions.py"
      - "tools/validate_legacy_engine_hardening.py"
      - "tools/validate_legacy_release_workbooks.py"
      - "tools/legacy_engine_oracles.py"
      - "tools/builders/legacy_frontier_release.py"
      - "tools/builders/build_*_release.py"
      - "standards/frontier/legacy_engine_registry.json"
      - "tests/test_legacy_engine_hardening.py"
      - "tests/test_legacy_release_workbooks.py"
      - "tests/test_legacy_engine_release.py"
      - ".github/workflows/legacy-engine-promotion-release.yml"
  push:
    branches:
      - agent/all-domain-m3-evidence-network-risk
    paths:
      - "tools/release_legacy_engine_promotions.py"
      - "tools/validate_legacy_engine_hardening.py"
      - "tools/validate_legacy_release_workbooks.py"
      - "tools/legacy_engine_oracles.py"
      - "tools/builders/legacy_frontier_release.py"
      - "tools/builders/build_*_release.py"
      - "standards/frontier/legacy_engine_registry.json"
      - "tests/test_legacy_engine_hardening.py"
      - "tests/test_legacy_release_workbooks.py"
      - "tests/test_legacy_engine_release.py"
      - ".github/workflows/legacy-engine-promotion-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-engine-promotion-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable frontier head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture immutable source head
        run: git rev-parse HEAD > .legacy-promotion-start-sha

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile and test release source
        run: |
          python -m compileall -q tools tests
          PYTHONPATH=. python -m unittest tests.test_legacy_engine_hardening -v
          PYTHONPATH=. python -m unittest tests.test_legacy_release_workbooks -v
          PYTHONPATH=. python -m unittest tests.test_legacy_engine_release -v

      - name: Revalidate independent oracle cases before release
        run: |
          PYTHONPATH=. python tools/validate_legacy_engine_hardening.py \
            --report legacy-promotion-oracle-report.json

      - name: Prepare six canonicals, twelve manifests, instances, and staged inventory
        run: |
          PYTHONPATH=.:tools python tools/release_legacy_engine_promotions.py prepare \
            --report legacy-promotion-prepare-report.json

      - name: Validate staged release state and all eighteen artifacts
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import json
          from pathlib import Path

          from tools.institutional_surface import profiles_by_id, validate_workbook_surface
          from tools.release_legacy_engine_promotions import (
              CANONICAL_PATHS,
              EXPECTED_IDS,
              INVENTORY_PATH,
              ROOT,
              case_specs,
          )
          from tools.validate_legacy_engine_hardening import validate as validate_program
          from tools.validate_legacy_release_workbooks import validate_workbook
          from tools.workbook_engineering import audit_workbook

          inventory = json.loads(INVENTORY_PATH.read_text(encoding='utf-8'))
          inventory_by_id = {item['id']: item for item in inventory['models']}
          profiles = profiles_by_id(ROOT)
          entries = [
              (model_id, CANONICAL_PATHS[model_id], f'canonical {model_id}')
              for model_id in sorted(EXPECTED_IDS)
          ]
          entries += [
              (spec['model_id'], spec['output'], f"instance {spec['id']}")
              for spec in case_specs()
          ]
          errors = []
          results = []
          audits = []
          for model_id, path_string, label in entries:
              path = Path(path_string)
              result = validate_workbook(model_id, path)
              results.append(result)
              errors.extend(f'{label}: {item}' for item in result['errors'])
              surface_errors = validate_workbook_surface(
                  path, inventory_by_id[model_id], profiles[model_id]
              )
              errors.extend(f'{label}: surface {item}' for item in surface_errors)
              summary, findings = audit_workbook(path)
              audit_errors = [
                  item.__dict__ for item in findings if item.severity == 'error'
              ]
              audits.append(
                  {'label': label, 'path': str(path), 'summary': summary, 'errors': audit_errors}
              )
              errors.extend(f'{label}: engineering {item}' for item in audit_errors)
          program = validate_program()
          errors.extend(f'program: {item}' for item in program['errors'])
          report = {
              'status': 'PASS' if not errors else 'FAIL',
              'artifacts': len(entries),
              'program': program,
              'contracts': results,
              'audits': audits,
              'errors': errors,
          }
          Path('legacy-promotion-pre-recalc-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          if errors:
              raise SystemExit(errors)
          PY

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Recalculate six canonicals and twelve benchmark instances
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import json
          from pathlib import Path

          from recalc import recalc
          from tools.release_legacy_engine_promotions import (
              CANONICAL_PATHS,
              EXPECTED_IDS,
              case_specs,
          )

          paths = [Path(CANONICAL_PATHS[model_id]) for model_id in sorted(EXPECTED_IDS)]
          paths += [Path(spec['output']) for spec in case_specs()]
          if len(paths) != 18 or len(set(paths)) != 18:
              raise SystemExit(f'expected 18 unique release workbooks, found {len(paths)}')
          report = {}
          failed = []
          for path in paths:
              result = recalc(path, timeout=120)
              report[str(path)] = result
              if result.get('status') != 'success' or result.get('total_errors', 0) != 0:
                  failed.append(str(path))
          Path('legacy-promotion-recalc-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          if failed:
              raise SystemExit(f'LibreOffice recalculation failed: {failed}')
          PY

      - name: Enforce post-recalculation contracts, surfaces, and engineering audit
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import json
          from pathlib import Path

          from tools.institutional_surface import profiles_by_id, validate_workbook_surface
          from tools.release_legacy_engine_promotions import (
              CANONICAL_PATHS,
              EXPECTED_IDS,
              INVENTORY_PATH,
              ROOT,
              case_specs,
          )
          from tools.validate_legacy_release_workbooks import validate_workbook
          from tools.workbook_engineering import audit_workbook

          inventory = json.loads(INVENTORY_PATH.read_text(encoding='utf-8'))
          inventory_by_id = {item['id']: item for item in inventory['models']}
          profiles = profiles_by_id(ROOT)
          entries = [
              (model_id, CANONICAL_PATHS[model_id], f'canonical {model_id}')
              for model_id in sorted(EXPECTED_IDS)
          ]
          entries += [
              (spec['model_id'], spec['output'], f"instance {spec['id']}")
              for spec in case_specs()
          ]
          errors = []
          contracts = []
          audits = []
          for model_id, path_string, label in entries:
              path = Path(path_string)
              result = validate_workbook(model_id, path)
              contracts.append(result)
              errors.extend(f'{label}: {item}' for item in result['errors'])
              surface_errors = validate_workbook_surface(
                  path, inventory_by_id[model_id], profiles[model_id]
              )
              errors.extend(f'{label}: surface {item}' for item in surface_errors)
              summary, findings = audit_workbook(path)
              audit_errors = [
                  item.__dict__ for item in findings if item.severity == 'error'
              ]
              audits.append(
                  {'label': label, 'path': str(path), 'summary': summary, 'errors': audit_errors}
              )
              errors.extend(f'{label}: engineering {item}' for item in audit_errors)
          report = {
              'status': 'PASS' if not errors else 'FAIL',
              'artifacts': len(entries),
              'contracts': contracts,
              'audits': audits,
              'errors': errors,
          }
          Path('legacy-promotion-post-recalc-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          if errors:
              raise SystemExit(errors)
          PY

      - name: Finalize benchmark receipts, index, and release declaration
        run: |
          PYTHONPATH=.:tools python tools/release_legacy_engine_promotions.py finalize \
            --report legacy-engine-release-final-report.json

      - name: Validate applied release, inventory, and full-library builder parity
        run: |
          PYTHONPATH=. python tools/validate_legacy_engine_hardening.py \
            --report legacy-promotion-final-oracle-report.json
          PYTHONPATH=.:tools python tools/validate_model_inventory.py \
            --report legacy-promotion-inventory-report.json
          PYTHONPATH=.:tools python tools/build_all_models.py \
            --report legacy-promotion-builder-parity-report.json \
            --require-parity

      - name: Verify final release ledger and benchmark receipt hashes
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from tools.release_legacy_engine_promotions import (
              BENCHMARK_INDEX_PATH,
              EXPECTED_IDS,
              REGISTRY_PATH,
              case_specs,
          )

          registry = json.loads(REGISTRY_PATH.read_text(encoding='utf-8'))
          index = json.loads(BENCHMARK_INDEX_PATH.read_text(encoding='utf-8'))
          errors = []
          if registry.get('status') != 'applied_release_validated':
              errors.append('legacy registry is not applied_release_validated')
          if index.get('instance_count') != 48:
              errors.append(f"benchmark index expected 48 instances, found {index.get('instance_count')}")
          by_id = {item.get('instance_id'): item for item in index.get('instances', [])}
          counts = {model_id: 0 for model_id in EXPECTED_IDS}
          for spec in case_specs():
              output = Path(spec['output'])
              receipt_path = output.with_suffix('.receipt.json')
              if not output.exists() or not receipt_path.exists():
                  errors.append(f"{spec['id']}: missing workbook or receipt")
                  continue
              receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
              digest = hashlib.sha256(output.read_bytes()).hexdigest()
              if receipt.get('workbook_sha256') != digest:
                  errors.append(f"{spec['id']}: receipt hash mismatch")
              if receipt.get('counts_toward_M4') is not False:
                  errors.append(f"{spec['id']}: synthetic benchmark may not count toward M4")
              if by_id.get(spec['id'], {}).get('workbook_sha256') != digest:
                  errors.append(f"{spec['id']}: benchmark index hash mismatch")
              counts[spec['model_id']] += 1
          if any(value != 2 for value in counts.values()):
              errors.append(f'invalid six-model benchmark counts {counts}')
          report = {
              'status': 'PASS' if not errors else 'FAIL',
              'registry_status': registry.get('status'),
              'instance_count': index.get('instance_count'),
              'benchmark_counts': counts,
              'errors': errors,
          }
          Path('legacy-promotion-final-verification.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          if errors:
              raise SystemExit(errors)
          PY

      - name: Reject stale six-engine release
        if: github.event_name == 'push'
        run: |
          git fetch origin agent/all-domain-m3-evidence-network-risk
          START_SHA=$(cat .legacy-promotion-start-sha)
          REMOTE_SHA=$(git rev-parse origin/agent/all-domain-m3-evidence-network-risk)
          echo "release source: $START_SHA"
          echo "remote source:  $REMOTE_SHA"
          test "$START_SHA" = "$REMOTE_SHA"

      - name: Commit complete six-engine release
        if: github.event_name == 'push'
        run: |
          git config user.name "finance-segway-legacy-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            standards/model_inventory.json \
            standards/frontier/legacy_engine_registry.json \
            standards/benchmark_cases/index.json \
            standards/benchmark_cases/ib-*.json \
            standards/benchmark_cases/corp-*.json \
            standards/benchmark_cases/credit-*.json \
            standards/benchmark_cases/debt-*.json \
            standards/benchmark_cases/public-*.json \
            standards/benchmark_cases/vc-*.json \
            01_Investment_Banking/_template_BASE.xlsx 01_Investment_Banking/instances/benchmark_* \
            02_Corporate_Finance/_template_BASE.xlsx 02_Corporate_Finance/instances/benchmark_* \
            05_Private_Credit/_template_CREDIT.xlsx 05_Private_Credit/instances/benchmark_* \
            06_Debt_Finance/_template_CREDIT.xlsx 06_Debt_Finance/instances/benchmark_* \
            07_Public_Finance/_template_PUBLIC_FINANCE.xlsx 07_Public_Finance/instances/benchmark_* \
            13_Venture_Capital/_template_VC.xlsx 13_Venture_Capital/instances/benchmark_* \
            legacy-engine-release-final-report.json
          if git diff --staged --quiet; then
            echo "Six-engine release is already current."
          else
            git commit -m "Release six legacy finance engines with benchmark evidence"
            git push origin HEAD:agent/all-domain-m3-evidence-network-risk
          fi

      - name: Upload six-engine release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-engine-promotion-${{ github.event_name }}
          path: |
            legacy-promotion-oracle-report.json
            legacy-promotion-prepare-report.json
            legacy-promotion-pre-recalc-report.json
            legacy-promotion-recalc-report.json
            legacy-promotion-post-recalc-report.json
            legacy-engine-release-final-report.json
            legacy-promotion-final-oracle-report.json
            legacy-promotion-inventory-report.json
            legacy-promotion-builder-parity-report.json
            legacy-promotion-final-verification.json
          if-no-files-found: warn
          retention-days: 30
