name: Evidence Receipt Integrity

on:
  pull_request:
    paths:
      - "tools/evidence_receipt_integrity.py"
      - ".github/workflows/evidence-receipt-integrity.yml"
      - "standards/public_cases/index.json"
      - "*/instances/public_*.xlsx"
      - "*/instances/public_*.receipt.json"
  push:
    branches:
      - main
    paths:
      - "tools/evidence_receipt_integrity.py"
      - ".github/workflows/evidence-receipt-integrity.yml"
      - "standards/public_cases/index.json"
      - "*/instances/public_*.xlsx"
      - "*/instances/public_*.receipt.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install repository dependencies
        run: pip install -r requirements.txt

      - name: Refresh all public evidence receipts and index entries
        run: |
          PYTHONPATH=. python tools/evidence_receipt_integrity.py \
            --refresh --check --report evidence-receipt-integrity-report.json

      - name: Validate combined evidence after receipt refresh
        run: |
          PYTHONPATH=.:tools python tools/final_public_evidence.py \
            --validate --require-instances

      - name: Upload receipt integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-receipt-integrity-${{ github.event_name }}
          path: |
            evidence-receipt-integrity-report.json
            all-domain-public-evidence-report.json
            final-public-evidence-report.json
          if-no-files-found: warn
          retention-days: 30
