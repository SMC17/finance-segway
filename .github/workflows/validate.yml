name: Validate Finance Models

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q tools
      - name: Validate integrated builders and templates
        run: python tools/validate_integrated_models.py
      - name: Scan all committed workbooks
        run: python tools/weekly_refresh_check.py .
