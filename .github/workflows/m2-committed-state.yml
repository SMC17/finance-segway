name: Committed M2 Real-Data Validation

on:
  pull_request:
    paths:
      - ".github/workflows/m2-committed-state.yml"
      - "standards/model_inventory.json"
      - "standards/public_cases/**"
      - "standards/m3_evidence/**"
      - "tools/**"
      - "tests/**"
      - "0[1-9]_*/**"
      - "1[0-9]_*/**"
      - "2[0-4]_*/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/m2-committed-state.yml"
      - "standards/model_inventory.json"
      - "standards/public_cases/**"
      - "standards/m3_evidence/**"
      - "tools/**"
      - "tests/**"
      - "0[1-9]_*/**"
      - "1[0-9]_*/**"
      - "2[0-4]_*/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  committed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice (test suite recalculates workbooks)
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Compile and run combined suite
        run: |
          python -m compileall -q finance_segway tools tests
          PYTHONPATH=. python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Validate committed real-data state
        run: |
          PYTHONPATH=.:tools python tools/final_public_evidence.py \
            --validate --require-instances
          PYTHONPATH=. python tools/evidence_receipt_integrity.py \
            --check --report committed-public-receipts.json
          PYTHONPATH=.:tools python tools/forecast_registration.py \
            --check --report committed-forecast-registry.json
          PYTHONPATH=.:tools python tools/validate_model_inventory.py \
            --report committed-model-inventory.json
          PYTHONPATH=.:tools python tools/build_all_models.py \
            --report committed-builder-parity.json --require-parity
          PYTHONPATH=.:tools python tools/workbook_engineering.py . \
            --report committed-workbook-engineering.json

      - name: Enforce exact release shape
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("standards/model_inventory.json").read_text())
          public = json.loads(Path("standards/public_cases/index.json").read_text())
          maturity = {}
          for model in inventory["models"]:
              maturity[model["declared_maturity"]] = maturity.get(model["declared_maturity"], 0) + 1
          errors = []
          # Ratchet floors, not exact counts: the frontier cohort (24 M2
          # models, 2 public cases each) must never shrink, but new domains
          # launching at their own honest maturity must not redden main
          # (the exact-count form broke the day the 25th model landed at M1).
          if maturity.get("M2", 0) < 24:
              errors.append(f"M2 cohort regressed below 24: {maturity}")
          below_m1 = {m for m in maturity if m not in {"M1", "M2", "M3", "M4"}}
          if below_m1:
              errors.append(f"invalid declared maturities: {sorted(below_m1)}")
          cases = public.get("case_count", 0)
          models = public.get("evidence_models", 0)
          if cases < 48 or models < 24:
              errors.append(f"public ledger regressed below 48 cases / 24 models: {cases}/{models}")
          if cases != 2 * models:
              errors.append(f"public ledger must stay two cases per evidence model: {cases} cases / {models} models")
          if Path("standards/benchmark_cases").exists():
              errors.append("retired synthetic benchmark directory was reintroduced")
          if errors:
              raise SystemExit(errors)
          print({"maturity": maturity, "public_cases": public["case_count"]})
          PY

      - name: Recalculate all public workbooks
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import json
          from pathlib import Path
          from recalc import recalc

          index = json.loads(Path("standards/public_cases/index.json").read_text())
          results, errors = [], []
          for item in index["cases"]:
              path = Path(item["output"])
              result = recalc(path, timeout=120)
              results.append({"case_id": item["case_id"], "path": str(path), "result": result})
              if result.get("status") != "success" or result.get("total_errors", 0) != 0:
                  errors.append(f"{item['case_id']}: {result}")
          Path("committed-public-recalc.json").write_text(
              json.dumps({"status": "PASS" if not errors else "FAIL", "errors": errors, "results": results}, indent=2) + "\n"
          )
          if errors:
              raise SystemExit(errors)
          PY

      - name: Refresh ephemeral hashes and revalidate
        run: |
          PYTHONPATH=. python tools/evidence_receipt_integrity.py \
            --refresh --check --report committed-public-post-recalc-receipts.json
          PYTHONPATH=.:tools python tools/final_public_evidence.py \
            --validate --require-instances

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committed-m2-real-data-${{ github.event_name }}
          path: |
            committed-public-receipts.json
            committed-model-inventory.json
            committed-builder-parity.json
            committed-workbook-engineering.json
            committed-public-recalc.json
            committed-public-post-recalc-receipts.json
          if-no-files-found: warn
          retention-days: 30
