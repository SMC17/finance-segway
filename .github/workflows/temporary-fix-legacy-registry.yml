name: Temporary Legacy Registry Path Fix

on:
  push:
    branches:
      - agent/all-domain-m3-evidence-network-risk
    paths:
      - ".github/workflows/temporary-fix-legacy-registry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/all-domain-m3-evidence-network-risk
          fetch-depth: 0
      - name: Patch exact builder path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('standards/frontier/legacy_engine_registry.json')
          text = path.read_text(encoding='utf-8')
          old = '"current_builder": "tools/builders/build_venture_capital_template.py"'
          new = '"current_builder": "tools/builders/build_vc_template.py"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one builder path to patch, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m json.tool standards/frontier/legacy_engine_registry.json >/dev/null
      - name: Commit exact patch
        run: |
          git config user.name 'finance-segway-frontier-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add standards/frontier/legacy_engine_registry.json
          git commit -m 'Fix governed Venture Capital builder path'
          git push origin HEAD:agent/all-domain-m3-evidence-network-risk
