name: Weekly Model Refresh Check

on:
  schedule:
    # Every Monday 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: {}  # allow manual trigger from the Actions tab

jobs:
  refresh-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Run refresh checker across entire repo
        run: python3 tools/weekly_refresh_check.py .

      - name: Commit refresh report(s)
        run: |
          git config user.name "refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "**/refresh_report_*.csv" || true
          git diff --staged --quiet || git commit -m "Weekly refresh report $(date +%F)"
          git push
