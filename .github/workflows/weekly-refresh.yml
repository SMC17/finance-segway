name: Weekly Model Refresh Check

on:
  schedule:
    # Monday at 12:00 UTC, approximately 08:00 America/New_York during daylight time.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan model library
        run: python tools/weekly_refresh_check.py .

      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-model-refresh-report
          path: refresh_report_*.csv
          if-no-files-found: error
          retention-days: 30
