name: Required Builder Parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice (test suite recalculates workbooks)
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Compile source tree and run tests
        run: |
          python -m compileall -q finance_segway tools tests
          PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Require semantic builder-to-artifact parity
        run: PYTHONPATH=.:tools python tools/build_all_models.py --report builder-parity-report.json --require-parity

      - name: Audit complete workbook library
        run: PYTHONPATH=.:tools python tools/workbook_engineering.py . --report workbook-engineering-report.json

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-builder-parity
          path: |
            builder-parity-report.json
            workbook-engineering-report.json
          if-no-files-found: warn
          retention-days: 30
