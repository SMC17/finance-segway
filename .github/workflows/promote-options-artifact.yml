name: Promote Options Artifact

on:
  push:
    branches: [agent/synthesize-finance-model-library-v2]
    paths:
      - 'tools/builders/build_options_institutional.py'
      - 'tools/validate_options_model.py'
      - 'finance_segway/derivatives.py'
      - 'tests/test_institutional_engines.py'
      - '.github/workflows/promote-options-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synthesis branch
        uses: actions/checkout@v4
        with:
          ref: agent/synthesize-finance-model-library-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile and test pricing engines
        run: |
          python -m py_compile tools/builders/build_options_institutional.py tools/validate_options_model.py finance_segway/derivatives.py
          PYTHONPATH=. python -m unittest tests.test_institutional_engines.EngineTests.test_black_scholes_parity_and_iv tests.test_institutional_engines.EngineTests.test_american_put_not_below_european -v

      - name: Generate and validate options workbook
        run: |
          PYTHONPATH=.:tools python tools/builders/build_options_institutional.py --output 14_Options_Derivatives/_template_OPTIONS.xlsx
          PYTHONPATH=.:tools python tools/validate_options_model.py 14_Options_Derivatives/_template_OPTIONS.xlsx

      - name: Promote options inventory contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('standards/model_inventory.json')
          inventory = json.loads(path.read_text())
          inventory['version'] = '1.2.0'
          model = next(item for item in inventory['models'] if item['id'] == '14')
          model['builder'] = 'tools/builders/build_options_institutional.py'
          model['declared_maturity'] = 'M2'
          model['required_engines'] = [
              'black_scholes', 'implied_volatility', 'american_option',
              'volatility_surface', 'portfolio_greeks', 'scenario_pnl',
              'strategy_payoff'
          ]
          model['required_perspectives'] = [
              'trader', 'market_maker', 'risk', 'portfolio_manager'
          ]
          model['reference_checks'] = [
              'put_call_parity', 'implied_volatility_convergence',
              'option_price_bounds', 'greek_signs', 'american_european_bound'
          ]
          path.write_text(json.dumps(inventory, indent=2) + '\n')
          PY

      - name: Validate inventory and full workbook library
        run: |
          PYTHONPATH=.:tools python tools/validate_model_inventory.py --report model-governance-report.json
          PYTHONPATH=.:tools python tools/workbook_engineering.py . --report workbook-engineering-report.json

      - name: Commit canonical options artifact and inventory
        run: |
          git config user.name 'finance-segway-model-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 14_Options_Derivatives/_template_OPTIONS.xlsx standards/model_inventory.json
          if git diff --staged --quiet; then
            echo 'Options artifact already matches canonical builder.'
          else
            git commit -m 'Promote institutional options model'
            git push origin HEAD:agent/synthesize-finance-model-library-v2
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: options-promotion-reports
          path: |
            model-governance-report.json
            workbook-engineering-report.json
          if-no-files-found: warn
          retention-days: 30
