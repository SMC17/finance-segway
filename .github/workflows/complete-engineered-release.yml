name: Complete Engineered Release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile and test source system
        run: |
          python -m compileall -q finance_segway tools tests
          PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Generate canonical release templates
        run: |
          PYTHONPATH=.:tools python tools/builders/build_lbo_release.py --output 03_Private_Equity/_template_LBO.xlsx
          cp 03_Private_Equity/_template_LBO.xlsx 04_Merchant_Banking/_template_LBO.xlsx
          PYTHONPATH=.:tools python tools/builders/build_risk_release.py --output 09_Risk_Management/_template_RISK.xlsx
          PYTHONPATH=.:tools python tools/builders/build_options_release.py --output 14_Options_Derivatives/_template_OPTIONS.xlsx
          PYTHONPATH=.:tools python tools/builders/build_insurance_release.py --output 18_Insurance_Actuarial/_template_INSURANCE.xlsx
          PYTHONPATH=.:tools python tools/builders/build_securitization_institutional.py --output 19_Structured_Finance_Securitization/_template_SECURITIZATION.xlsx
          PYTHONPATH=.:tools python tools/builders/build_project_finance_release.py --output 20_Project_Finance/_template_PROJECT_FINANCE.xlsx
          PYTHONPATH=.:tools python tools/builders/build_fixed_income_release.py --output 21_Fixed_Income_Rates/_template_FIXED_INCOME.xlsx
          PYTHONPATH=.:tools python tools/builders/build_quant_release.py --output 22_Quantitative_Systematic/_template_QUANT.xlsx

      - name: Enforce pre-recalculation contracts
        run: |
          PYTHONPATH=.:tools python tools/validate_lbo_model.py 03_Private_Equity/_template_LBO.xlsx
          PYTHONPATH=.:tools python tools/validate_lbo_model.py 04_Merchant_Banking/_template_LBO.xlsx
          PYTHONPATH=.:tools python tools/validate_risk_model.py 09_Risk_Management/_template_RISK.xlsx
          PYTHONPATH=.:tools python tools/validate_options_model.py 14_Options_Derivatives/_template_OPTIONS.xlsx
          PYTHONPATH=.:tools python tools/validate_insurance_model.py 18_Insurance_Actuarial/_template_INSURANCE.xlsx
          PYTHONPATH=.:tools python tools/validate_securitization_model.py 19_Structured_Finance_Securitization/_template_SECURITIZATION.xlsx
          PYTHONPATH=.:tools python tools/validate_project_finance_model.py 20_Project_Finance/_template_PROJECT_FINANCE.xlsx
          PYTHONPATH=.:tools python tools/validate_fixed_income_model.py 21_Fixed_Income_Rates/_template_FIXED_INCOME.xlsx
          PYTHONPATH=.:tools python tools/validate_quant_model.py 22_Quantitative_Systematic/_template_QUANT.xlsx

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Recalculate templates and reject cached errors
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import json
          from pathlib import Path
          from recalc import recalc

          paths = [
              Path('03_Private_Equity/_template_LBO.xlsx'),
              Path('04_Merchant_Banking/_template_LBO.xlsx'),
              Path('09_Risk_Management/_template_RISK.xlsx'),
              Path('14_Options_Derivatives/_template_OPTIONS.xlsx'),
              Path('18_Insurance_Actuarial/_template_INSURANCE.xlsx'),
              Path('19_Structured_Finance_Securitization/_template_SECURITIZATION.xlsx'),
              Path('20_Project_Finance/_template_PROJECT_FINANCE.xlsx'),
              Path('21_Fixed_Income_Rates/_template_FIXED_INCOME.xlsx'),
              Path('22_Quantitative_Systematic/_template_QUANT.xlsx'),
          ]
          report, failed = {}, []
          for path in paths:
              result = recalc(path, timeout=120)
              report[str(path)] = result
              if result.get('status') != 'success' or result.get('total_errors', 0) != 0:
                  failed.append(str(path))
          Path('engineered-template-recalc-report.json').write_text(json.dumps(report, indent=2))
          if failed:
              raise SystemExit(f'template recalculation failed: {failed}')
          PY

      - name: Enforce post-recalculation contracts
        run: |
          PYTHONPATH=.:tools python tools/validate_lbo_model.py 03_Private_Equity/_template_LBO.xlsx
          PYTHONPATH=.:tools python tools/validate_lbo_model.py 04_Merchant_Banking/_template_LBO.xlsx
          PYTHONPATH=.:tools python tools/validate_risk_model.py 09_Risk_Management/_template_RISK.xlsx
          PYTHONPATH=.:tools python tools/validate_options_model.py 14_Options_Derivatives/_template_OPTIONS.xlsx
          PYTHONPATH=.:tools python tools/validate_insurance_model.py 18_Insurance_Actuarial/_template_INSURANCE.xlsx
          PYTHONPATH=.:tools python tools/validate_securitization_model.py 19_Structured_Finance_Securitization/_template_SECURITIZATION.xlsx
          PYTHONPATH=.:tools python tools/validate_project_finance_model.py 20_Project_Finance/_template_PROJECT_FINANCE.xlsx
          PYTHONPATH=.:tools python tools/validate_fixed_income_model.py 21_Fixed_Income_Rates/_template_FIXED_INCOME.xlsx
          PYTHONPATH=.:tools python tools/validate_quant_model.py 22_Quantitative_Systematic/_template_QUANT.xlsx

      - name: Promote inventory and institutional surfaces
        run: |
          python tools/promote_engineered_flagships.py --version 2.1.0
          PYTHONPATH=.:tools python tools/promote_institutional_surface.py --report institutional-surface-report.json
          PYTHONPATH=.:tools python tools/validate_model_inventory.py --report model-governance-report.json

      - name: Enforce full-library semantic parity and audit
        run: |
          PYTHONPATH=.:tools python tools/build_all_models.py --report builder-parity-report.json --require-parity
          PYTHONPATH=.:tools python tools/workbook_engineering.py . --report workbook-engineering-report.json

      - name: Generate reference and adversarial benchmark instances
        run: PYTHONPATH=.:tools python tools/generate_benchmark_instances_v2.py --root .

      - name: Recalculate every benchmark instance
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import json
          from pathlib import Path
          from recalc import recalc

          paths = sorted(Path('.').glob('0[349]_*/instances/benchmark_*.xlsx'))
          paths += sorted(Path('.').glob('1[489]_*/instances/benchmark_*.xlsx'))
          paths += sorted(Path('.').glob('2[012]_*/instances/benchmark_*.xlsx'))
          report, failed = {}, []
          for path in paths:
              result = recalc(path, timeout=120)
              report[str(path)] = result
              if result.get('status') != 'success' or result.get('total_errors', 0) != 0:
                  failed.append(str(path))
          Path('benchmark-instance-recalc-report.json').write_text(json.dumps(report, indent=2))
          if len(paths) != 18:
              raise SystemExit(f'expected 18 benchmark instances, found {len(paths)}')
          if failed:
              raise SystemExit(f'benchmark recalculation failed: {failed}')
          PY

      - name: Generate release evidence and institutional control plane
        run: |
          PYTHONPATH=.:tools python tools/workbook_engineering.py . --report pre-control-plane-engineering-report.json
          PYTHONPATH=.:tools python tools/generate_release_evidence.py --release-id flagship-2.1.0 --output standards/releases/flagship-2.1.0.json
          PYTHONPATH=.:tools python tools/build_institutional_control_plane.py --report control-plane-report.json
          PYTHONPATH=.:tools python tools/workbook_engineering.py . --report complete-workbook-engineering-report.json

      - name: Upload complete release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-engineered-release-evidence-${{ github.event_name }}
          path: |
            engineered-template-recalc-report.json
            benchmark-instance-recalc-report.json
            builder-parity-report.json
            institutional-surface-report.json
            control-plane-report.json
            model-governance-report.json
            workbook-engineering-report.json
            pre-control-plane-engineering-report.json
            complete-workbook-engineering-report.json
            standards/releases/flagship-2.1.0.json
          if-no-files-found: warn
          retention-days: 30
