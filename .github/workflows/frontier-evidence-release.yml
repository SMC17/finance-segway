name: Frontier Evidence Release

on:
  pull_request:
    paths:
      - "tools/frontier_evidence.py"
      - "tools/frontier_evidence_release.py"
      - "tools/frontier_evidence_registry.py"
      - "tests/test_frontier_evidence.py"
      - ".github/workflows/frontier-evidence-release.yml"
      - "standards/benchmark_cases/**"
      - "tools/m3_evidence.py"
      - "tools/model_instance_release.py"
  push:
    branches:
      - agent/all-domain-m3-evidence-network-risk
    paths:
      - "tools/frontier_evidence.py"
      - "tools/frontier_evidence_release.py"
      - "tools/frontier_evidence_registry.py"
      - "tests/test_frontier_evidence.py"
      - ".github/workflows/frontier-evidence-release.yml"
      - "standards/benchmark_cases/**"
      - "tools/m3_evidence.py"
      - "tools/model_instance_release.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontier-evidence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable frontier head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture immutable source head
        run: git rev-parse HEAD > .frontier-evidence-start-sha

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile and test evidence source
        run: |
          python -m compileall -q tools tests
          PYTHONPATH=. python -m unittest tests.test_frontier_evidence -v
          PYTHONPATH=. python -m unittest tests.test_m3_evidence -v

      - name: Materialize nine evidence packs and eighteen public instances
        run: |
          PYTHONPATH=.:tools python tools/frontier_evidence_release.py \
            --generate-instances --require-instances

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Independently recalculate public workbooks and refresh receipts
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import hashlib
          import json
          from datetime import date
          from pathlib import Path

          from recalc import recalc
          from tools.frontier_evidence import PUBLIC_INDEX, case_outputs

          paths = case_outputs()
          if len(paths) != 18 or len(set(paths)) != 18:
              raise SystemExit(f"expected 18 unique frontier evidence workbooks, found {len(paths)}")
          recalc_report = {}
          failed = []
          refreshed = {}
          for path in paths:
              result = recalc(path, timeout=120)
              recalc_report[str(path)] = result
              if result.get("status") != "success" or result.get("total_errors", 0) != 0:
                  failed.append(str(path))
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              receipt_path = path.with_suffix(".receipt.json")
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              receipt["workbook_sha256"] = digest
              receipt["recalculated_on"] = date.today().isoformat()
              receipt["recalculation_engine"] = "LibreOffice Calc"
              receipt_path.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
              refreshed[str(path)] = receipt

          index = json.loads(PUBLIC_INDEX.read_text(encoding="utf-8"))
          for item in index["cases"]:
              output = item["output"]
              if output in refreshed:
                  item["receipt"] = refreshed[output]
          PUBLIC_INDEX.write_text(json.dumps(index, indent=2) + "\n", encoding="utf-8")

          Path("frontier-public-recalc-report.json").write_text(
              json.dumps(recalc_report, indent=2) + "\n", encoding="utf-8"
          )
          if failed:
              raise SystemExit(f"frontier evidence recalculation failed: {failed}")
          PY

      - name: Enforce workbook contracts and engineering audit after recalculation
        run: |
          PYTHONPATH=.:tools python - <<'PY'
          import json
          from pathlib import Path

          from tools.frontier_evidence_registry import registry
          from tools.validate_hardened_workbooks import validate_workbook
          from tools.workbook_engineering import audit_workbook

          errors = []
          results = []
          audits = []
          for model in registry()["flagships"]:
              for case in model["cases"]:
                  path = Path(case["output"])
                  result = validate_workbook(model["model_id"], path)
                  results.append(result)
                  errors.extend(
                      f"{case['id']}: {error}" for error in result["errors"]
                  )
                  summary, findings = audit_workbook(path)
                  audit_errors = [
                      finding.__dict__
                      for finding in findings
                      if finding.severity == "error"
                  ]
                  audits.append(
                      {
                          "case_id": case["id"],
                          "path": str(path),
                          "summary": summary,
                          "errors": audit_errors,
                      }
                  )
                  errors.extend(
                      f"{case['id']}: engineering {error}"
                      for error in audit_errors
                  )
          report = {
              "status": "PASS" if not errors else "FAIL",
              "errors": errors,
              "contracts": results,
              "audits": audits,
          }
          Path("frontier-public-workbook-report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          if errors:
              raise SystemExit(errors)
          PY

      - name: Validate combined evidence, frontier program, and prior releases
        run: |
          PYTHONPATH=.:tools python tools/frontier_evidence.py \
            --validate --require-instances
          PYTHONPATH=. python tools/validate_frontier_program.py \
            --report frontier-program-report.json
          PYTHONPATH=. python tools/validate_domain_hardening.py \
            --report frontier-domain-hardening-report.json

      - name: Reject stale evidence release
        if: github.event_name == 'push'
        run: |
          git fetch origin agent/all-domain-m3-evidence-network-risk
          START_SHA=$(cat .frontier-evidence-start-sha)
          REMOTE_SHA=$(git rev-parse origin/agent/all-domain-m3-evidence-network-risk)
          echo "evidence source: $START_SHA"
          echo "remote source:   $REMOTE_SHA"
          test "$START_SHA" = "$REMOTE_SHA"

      - name: Commit atomic nine-domain evidence release
        if: github.event_name == 'push'
        run: |
          git config user.name "finance-segway-frontier-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            standards/m3_evidence/frontier_registry.json \
            standards/public_cases \
            08_Asset_Management/model_card.md 08_Asset_Management/validation.md 08_Asset_Management/sources 08_Asset_Management/governance 08_Asset_Management/outcomes 08_Asset_Management/releases 08_Asset_Management/instances/public_* \
            10_Trade_Finance/model_card.md 10_Trade_Finance/validation.md 10_Trade_Finance/sources 10_Trade_Finance/governance 10_Trade_Finance/outcomes 10_Trade_Finance/releases 10_Trade_Finance/instances/public_* \
            11_Microfinance/model_card.md 11_Microfinance/validation.md 11_Microfinance/sources 11_Microfinance/governance 11_Microfinance/outcomes 11_Microfinance/releases 11_Microfinance/instances/public_* \
            12_Equity_Finance/model_card.md 12_Equity_Finance/validation.md 12_Equity_Finance/sources 12_Equity_Finance/governance 12_Equity_Finance/outcomes 12_Equity_Finance/releases 12_Equity_Finance/instances/public_* \
            15_Commodities/model_card.md 15_Commodities/validation.md 15_Commodities/sources 15_Commodities/governance 15_Commodities/outcomes 15_Commodities/releases 15_Commodities/instances/public_* \
            16_Crypto_Digital_Assets/model_card.md 16_Crypto_Digital_Assets/validation.md 16_Crypto_Digital_Assets/sources 16_Crypto_Digital_Assets/governance 16_Crypto_Digital_Assets/outcomes 16_Crypto_Digital_Assets/releases 16_Crypto_Digital_Assets/instances/public_* \
            17_Real_Estate_REIT/model_card.md 17_Real_Estate_REIT/validation.md 17_Real_Estate_REIT/sources 17_Real_Estate_REIT/governance 17_Real_Estate_REIT/outcomes 17_Real_Estate_REIT/releases 17_Real_Estate_REIT/instances/public_* \
            23_Fintech_Payments/model_card.md 23_Fintech_Payments/validation.md 23_Fintech_Payments/sources 23_Fintech_Payments/governance 23_Fintech_Payments/outcomes 23_Fintech_Payments/releases 23_Fintech_Payments/instances/public_* \
            24_Distressed_Restructuring/model_card.md 24_Distressed_Restructuring/validation.md 24_Distressed_Restructuring/sources 24_Distressed_Restructuring/governance 24_Distressed_Restructuring/outcomes 24_Distressed_Restructuring/releases 24_Distressed_Restructuring/instances/public_* \
            m3-evidence-report.json frontier-evidence-report.json all-domain-evidence-report.json
          if git diff --staged --quiet; then
            echo "Frontier evidence release is already current."
          else
            git commit -m "Materialize public evidence for nine hardened domains"
            git push origin HEAD:agent/all-domain-m3-evidence-network-risk
          fi

      - name: Upload frontier evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-evidence-${{ github.event_name }}
          path: |
            frontier-evidence-report.json
            all-domain-evidence-report.json
            frontier-public-recalc-report.json
            frontier-public-workbook-report.json
            frontier-program-report.json
            frontier-domain-hardening-report.json
            m3-evidence-report.json
            standards/public_cases/index.json
          if-no-files-found: warn
          retention-days: 30
