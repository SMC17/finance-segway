name: Model Governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice (needed for real public-case verification)
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Compile governance and reconciliation sources
        run: |
          python -m py_compile tools/validate_model_inventory.py
          python -m py_compile tools/reference_engines.py
          python -m py_compile tools/test_reference_engines.py
          python -m py_compile tools/scaffold_model_evidence.py
          python -m py_compile tools/reconciled_reference_engines.py
          python -m py_compile tools/test_reconciled_reference_engines.py
          python -m py_compile tools/validate_reconciled_models.py
          python -m py_compile tools/builders/institutional_helpers.py
          python -m py_compile tools/builders/build_private_credit_template.py
          python -m py_compile tools/builders/build_debt_finance_template.py
          python -m py_compile tools/builders/build_public_finance_template.py

      - name: Test independent reference engines
        run: |
          python tools/test_reference_engines.py
          PYTHONPATH=tools python tools/test_reconciled_reference_engines.py

      - name: Validate reconciled builder outputs
        run: python tools/validate_reconciled_models.py --report reconciled-model-report.json

      - name: Validate committed reconciled artifacts
        run: python tools/validate_reconciled_models.py --committed --report committed-reconciled-model-report.json

      - name: Recalculate every public case and verify its real decision status
        run: |
          PYTHONPATH=. python tools/verify_public_case_status.py \
            --report public-case-status-report.json

      - name: Validate model inventory and maturity claims
        run: |
          python tools/validate_model_inventory.py \
            --public-case-report public-case-status-report.json \
            --report model-governance-report.json

      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-governance-report
          path: |
            model-governance-report.json
            reconciled-model-report.json
            committed-reconciled-model-report.json
            public-case-status-report.json
          if-no-files-found: warn
          retention-days: 30
