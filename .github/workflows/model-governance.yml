name: Model Governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile governance sources
        run: |
          python -m py_compile tools/validate_model_inventory.py
          python -m py_compile tools/reference_engines.py
          python -m py_compile tools/test_reference_engines.py

      - name: Test independent reference engines
        run: python tools/test_reference_engines.py

      - name: Validate model inventory and maturity claims
        run: python tools/validate_model_inventory.py --report model-governance-report.json

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-governance-report
          path: model-governance-report.json
          if-no-files-found: warn
          retention-days: 30
