version: 2

sources:
  - name: finance_segway
    description: "Tables loaded from governed, source-addressed public workbooks."
    schema: public
    tables:
      - name: deals
        columns:
          - name: deal_id
            tests: [unique, not_null]
          - name: classification
            tests:
              - accepted_values:
                  values: ['real_public']
          - name: workbook_path
            tests: [not_null]
      - name: deal_returns
        columns:
          - name: deal_id
            tests: [not_null]
          - name: metric
            tests: [not_null]
      - name: deal_debt_schedule
        columns:
          - name: deal_id
            tests: [not_null]
          - name: period
            tests: [not_null]
          - name: metric
            tests: [not_null]

models:
  - name: stg_deals
    description: "Real-public deal registry."
    columns:
      - name: deal_id
        tests: [unique, not_null]
      - name: classification
        tests:
          - accepted_values:
              values: ['real_public']

  - name: stg_deal_returns
    description: "Long-form committed return outputs."
    columns:
      - name: deal_id
        tests: [not_null]

  - name: stg_deal_debt_schedule
    description: "Long-form committed debt-schedule outputs."
    columns:
      - name: deal_id
        tests: [not_null]

  - name: mart_selected_exit_returns
    description: "One row per real-public deal at the selected exit."
    columns:
      - name: deal_id
        tests: [unique, not_null]
      - name: classification
        tests:
          - accepted_values:
              values: ['real_public']
      - name: sponsor_moic
        tests: [not_null]
      - name: sponsor_irr
        tests: [not_null]

  - name: mart_leverage_path
    description: "Debt and cash trajectory by deal and period."
    columns:
      - name: deal_id
        tests: [not_null]
      - name: period
        tests: [not_null]
